A:{c5:{m:'15.11.2026 · 9 min',au:'Айдар Касымов',ru:{t:'Интеграция C5+1: как Центральная Азия превращает многовекторность в единую переговорную силу',l:'Пять государств синхронизируют торговые коридоры, тарифы и климатическую дипломатию, выступая единым субъектом в диалоге с Китаем, ЕС, США, Россией и странами Залива.',b:['Внутрирегиональная торговля выросла до $11.4 млрд (+14.2%).','Формат C5+1 охватывает уже 7 глобальных центров силы.','Совместные фонды развития снижают зависимость от внешнего кредитования.'],p:['Три десятилетия регион рассматривали сквозь призму «новой Большой игры». К 2026 году эта модель устарела: регулярные консультативные встречи глав государств превратили его в самостоятельный геоэкономический блок.','Выступая консолидированно, пять столиц добиваются локализации переработки критических минералов и инвестиций в зелёную энергетику.']},en:{t:'C5+1 Integration: How Central Asia Turns Multi-Vector Diplomacy into Collective Bargaining Power',l:'The five republics are synchronizing corridors, tariffs and climate diplomacy to negotiate as one bloc with China, the EU, the US, Russia and the Gulf.',b:['Intra-regional trade reached $11.4B (+14.2% YoY).','C5+1 now spans seven major global power centers.','Joint development funds bolster financial autonomy.'],p:['For three decades the region was seen as an arena of great-power rivalry. By 2026, regular consultative meetings of heads of state have made it a coordinated geoeconomic actor.','Negotiating together, the capitals secure local mineral refining and direct investment into renewable grids.']}},
security:{m:'12.11.2026 · 7 min',au:'Бектур Асанов',ru:{t:'Безопасность и границы: Ферганский прецедент и новая архитектура стабильности',l:'Завершение делимитации границ между Кыргызстаном, Таджикистаном и Узбекистаном устранило главный внутренний риск безопасности региона.',b:['Оформление границ сняло десятилетия территориальных споров.','Новые КПП и ID-карты стимулируют приграничную торговлю.','ШОС, ОДКБ и ОТГ обеспечивают многослойную защиту рубежей.'],p:['Ферганская долина долго считалась самым уязвимым узлом региона. Соглашения о делимитации и демаркации изменили архитектуру безопасности.','Устранение внутренних трений лишило внешних игроков рычага давления.']},en:{t:'Security & Borders: The Fergana Precedent and Central Asia’s New Stability Architecture',l:'Final border delimitation among Kyrgyzstan, Tajikistan and Uzbekistan has removed the region’s foremost internal security vulnerability.',b:['Demarcation resolved decades of territorial friction.','New checkpoints and ID-card transit boost cross-border SME trade.','Overlapping SCO, CSTO and OTS frameworks reinforce stability.'],p:['Long the region’s most sensitive flashpoint, the Fergana Valley has been transformed by sequential border treaties.','Ending internal disputes removed a primary lever of external manipulation.']}},
water:{m:'09.11.2026 · 8 min',au:'Малика Рахимова',ru:{t:'Вода и ресурсы: как Камбаратинская ГЭС-1 меняет баланс в регионе',l:'Консорциум Кыргызстана, Казахстана и Узбекистана переводит управление стоком Сырдарьи и Амударьи в прагматичное коммерческое русло.',b:['Софинансирование Камбаратинской ГЭС-1 (1860 МВт) гарантирует летний сток.','Модернизация ирригации сокращает потери воды на 25–30%.','Диалог с Афганистаном по каналу Кош-Тепа снижает риски.'],p:['Противоречие между зимней генерацией в верховьях и летней ирригацией в низовьях десятилетиями оставалось главным вызовом региона.','Совместное инвестирование превращает воду из предмета торга с нулевой суммой в общий актив.']},en:{t:'Water & Resources: How Kambarata-1 HPP Reshapes the Regional Balance',l:'A consortium of Kyrgyzstan, Kazakhstan and Uzbekistan turns Syr Darya and Amu Darya governance into a bankable joint enterprise.',b:['Co-financing Kambarata-1 HPP (1,860 MW) secures summer flows.','Canal modernization cuts losses by 25–30%.','Engagement with Kabul over the Qosh Tepa Canal mitigates risk.'],p:['Balancing upstream winter hydropower with downstream summer irrigation has long been the central resource dilemma.','Joint equity turns transboundary water into a shared economic asset.']}},
